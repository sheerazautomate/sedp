name: Fetch Grades enrollment

# Daily download of the Grades districts-enrollment export.
# Commits data/enrollment.csv (+ yesterday's copy + meta.json) so the
# GitHub Pages dashboard reads fresh data with no live login.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   GRADES_EMAIL     login email for grades.pesrp.edu.pk
#   GRADES_PASSWORD  login password
#
# NOTE: workflows only run on the default branch. Merge this file to `main`
# to activate the schedule.

on:
  schedule:
    - cron: "0 1 * * *"    # 06:00 PKT (01:00 UTC)
    - cron: "0 7 * * *"    # 12:00 PKT (07:00 UTC)
    - cron: "0 13 * * *"   # 18:00 PKT (13:00 UTC)
    - cron: "59 18 * * *"  # 23:59 PKT (18:59 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test login + export without committing (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: fetch-enrollment
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Download Grades export
        env:
          GRADES_EMAIL: ${{ secrets.GRADES_EMAIL }}
          GRADES_PASSWORD: ${{ secrets.GRADES_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/fetch_grades.py --dry-run
          else
            python scripts/fetch_grades.py
          fi

      - name: Commit data files
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update enrollment data ($(date -u +%F))"
            git push
          fi
